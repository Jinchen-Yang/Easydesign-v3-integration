# Copy only when config/llm.yaml does not exist. Never put an API key in this YAML.
# DeepSeek's official current alias, verified 2026-09-10 (aliases can change upstream).
default:
  provider: deepseek
  model: deepseek-flash
  secret_env: DEEPSEEK_API_KEY
  timeout_seconds: 90
  max_output_tokens: 2048

# All roles use default unless an explicit role override is provided.
roles: {}
# Shared execution default comes from ModelConfig: 64 in Phase 2.
# Coordinator, all specialists and framework summaries consume the same ledger.
# Restart/resume preserves it; an accepted Gate or new user turn starts one new budget.
# Omit max_model_calls to use that single runtime default.
# Native working-memory summarization starts above this target. The hard guard is a separate
# fail-closed request-capacity boundary and must remain above the working target.
max_input_chars: 120000
hard_input_chars: 250000

# To use a different provider, change provider, model AND secret_env together.
# Supported providers in Phase 1: deepseek, openai, anthropic.
# Example role override (replace the model placeholder with your enabled model):
# roles:
#   judge:
#     provider: anthropic
#     model: YOUR_ENABLED_ANTHROPIC_MODEL
#     secret_env: ANTHROPIC_API_KEY
#     timeout_seconds: 90
#     max_output_tokens: 2048
