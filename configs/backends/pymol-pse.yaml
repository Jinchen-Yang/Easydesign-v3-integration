backend_name: pymol-pse
backend_version: 3.1.0
python_baseline: "3.11"
runtime:
  environment_spec: environments/pymol-pse.yml
  executable_env_var: EASYDESIGN_PYMOL_PYTHON
  timeout_seconds: 120
  site_paths_committed: false
protocol:
  request_format: json
  response_format: json
  coordinate_format: pdb
  shell: false
failure_policy:
  executable_discovery: forbidden
  version_fallback: forbidden
  input_fallback: forbidden
  overwrite_attempt: forbidden
