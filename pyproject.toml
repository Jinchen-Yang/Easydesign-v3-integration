[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easydesign-local"
version = "0.1.0.dev1"
description = "A local, stepwise and traceable binder-design workflow for researchers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "biopython>=1.84,<2",
  "gemmi>=0.7,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "platformdirs>=4.3,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
easydesign = "easydesign.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easydesign = [
  "py.typed",
  "reporting/static/target_viewer/*.html",
  "reporting/static/target_viewer/*.js",
  "reporting/static/target_viewer/*.css",
  "reporting/static/target_viewer/vendor/molstar/LICENSE",
  "reporting/static/target_viewer/vendor/molstar/*.js",
  "reporting/static/target_viewer/vendor/molstar/*.css",
  "resources/scaffolds/vhh/official_boltzgen_0_3_2/*.yaml",
  "resources/scaffolds/vhh/official_boltzgen_0_3_2/*.cif",
  "resources/scaffolds/vhh/official_boltzgen_0_3_2/*.txt",
  "resources/filter_profiles/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "runtime/cache/dev/pytest"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "runtime/cache/dev/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["easydesign"]
cache_dir = "runtime/cache/dev/mypy"
