[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easydesign-local"
version = "0.1.0.dev1"
description = "A local, stepwise and traceable binder-design workflow for researchers"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "biopython>=1.84,<2",
  "gemmi>=0.7,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "platformdirs>=4.3,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
easydesign = "easydesign.cli:main"
easydesign-agent = "easydesign.agent.cli:main"
easydesign-workbench = "easydesign.product.server:main"

[project.optional-dependencies]
agent = [
  "deepagents==0.7.13",
  "langchain==1.4.0",
  "langchain-core==1.6.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-openai==1.6.1",
  "langchain-anthropic==1.7.1",
]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-asyncio>=1,<2",
  "ruff>=0.8",
  "setuptools>=69",
  "wheel>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easydesign = [
  "agent/skills/*/SKILL.md",
  "agent/skills/*/references/*.md",
  "agent/skills/shared/*.md",
  "agent/skills/*/assets/*/*.yaml",
  "agent/skills/*/assets/*/*.cif",
  "agent/skills/*/assets/*/*.json",
  "py.typed",
  "reporting/static/target_viewer/*.html",
  "reporting/static/target_viewer/*.js",
  "reporting/static/target_viewer/*.css",
  "reporting/static/target_viewer/vendor/molstar/LICENSE",
  "reporting/static/target_viewer/vendor/molstar/*.js",
  "reporting/static/target_viewer/vendor/molstar/*.css",
  "reporting/static/review_dashboard/*.html",
  "reporting/static/review_dashboard/*.js",
  "reporting/static/review_dashboard/*.css",
  "reporting/static/review_dashboard/vendor/3dmol/*.js",
  "reporting/static/review_dashboard/vendor/3dmol/LICENSE",
  "reporting/static/gpcr_site_review/*.html",
  "reporting/static/gpcr_site_review/*.js",
  "reporting/static/gpcr_site_review/*.css",
  "resources/scaffolds/vhh/official_boltzgen_0_3_2/*.yaml",
  "resources/scaffolds/vhh/official_boltzgen_0_3_2/*.cif",
  "resources/scaffolds/vhh/official_boltzgen_0_3_2/*.txt",
  "resources/filter_profiles/*.yaml",
  "resources/backend_capabilities/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "runtime/cache/dev/pytest"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "runtime/cache/dev/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["easydesign"]
cache_dir = "runtime/cache/dev/mypy"
