name: uv local product regression

on:
  push:
    branches: [easydesign-local]
  pull_request:

jobs:
  local-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Sync the frozen local development environment
        run: uv sync --frozen --extra dev
      - name: Verify lock and product entry points
        run: |
          uv lock --check
          uv run easydesign --version
          uv run easydesign --help
          uv run easydesign runtime --help
          uv run easydesign step --help
      - name: Run focused local product tests
        run: |
          uv run python -m pytest \
            tests/unit/core \
            tests/unit/test_workspace_context.py \
            tests/unit/test_cli.py \
            tests/unit/orchestration/test_runtime_link.py \
            tests/unit/test_runtime_guard.py

  full-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync the frozen development environment
        run: uv sync --frozen --extra dev
      - name: Run complete Python quality and regression gates
        run: |
          uv lock --check
          make check
          make test
